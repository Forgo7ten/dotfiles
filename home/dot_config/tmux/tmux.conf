# =============================================================================
# tmux 基础配置（chezmoi: ~/.config/tmux/tmux.conf）
# =============================================================================

# --- 基础行为 ---------------------------------------------------------------

# 用鼠标选择 Pane、调整大小和滚动；键盘操作仍保留 tmux 默认行为。
set -g mouse on

# 每个 Pane 的滚动历史保留 20000 行，适合查看长命令和 Agent 输出。
set -g history-limit 20000

# 复制模式使用 tmux 内置的 vi 风格键位。
setw -g mode-keys vi

# 缩短 Esc 键的识别等待，提高 Neovim 响应速度。
# SSH/高延迟场景如果 Alt 键不稳定，可尝试恢复默认值。
set -sg escape-time 20

# 将终端窗口、Pane 的焦点变化传递给内部程序。
set -s focus-events on

# --- 状态栏与窗口 -----------------------------------------------------------

# 状态栏左侧最大长度从默认的 10 增加到 30，避免较长的 Session 名称被截断。
set -g status-left-length 30

# 状态栏提示消息显示 1500 毫秒。
set -g display-time 1500

# 关闭 Window 后自动整理编号，避免 1、3、5 这样的空缺。
set -g renumber-windows on

# 监控后台 Window 的终端输出；有新输出时在状态栏中显示活动标记。
setw -g monitor-activity on

# --- 继承工作目录 -----------------------------------------------------------

# Ctrl+b 后按 c：新建 Window 时沿用当前 Pane 的目录。
bind c new-window -c "#{pane_current_path}"

# Ctrl+b 后按 %：左右分屏，继承当前目录。
bind % split-window -hc "#{pane_current_path}"

# Ctrl+b 后按双引号：上下分屏，继承当前目录。
bind '"' split-window -c "#{pane_current_path}"

# --- Session 保存与恢复 -----------------------------------------------------

# Resurrect 快照放到 XDG state 目录，避免将运行时数据纳入 chezmoi。
# 不开启 Pane 内容持久化，减少敏感终端输出留在磁盘上的可能。
set -g @resurrect-dir '~/.local/state/tmux/resurrect'

# 仅当 tmux Server 首次启动时尝试自动恢复最近一次快照。
set -g @continuum-restore 'on'

# 每 5 分钟保存一次（默认 15 分钟），降低关机导致的布局丢失。
set -g @continuum-save-interval '5'

# continuum 依赖 tmux 状态栏来触发定时保存。
set -g status on

# --- TPM 插件管理 -----------------------------------------------------------

# 插件实际下载在 XDG data 目录；TPM 本体由 chezmoi external 管理。
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'               # TPM 插件管理器
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Ctrl+b, Ctrl+s 保存；Ctrl+b, Ctrl+r 恢复
set -g @plugin 'tmux-plugins/tmux-yank'         # 将复制内容写入系统剪贴板
set -g @plugin 'omerxx/tmux-sessionx'           # 默认 Ctrl+b, Shift+o：选择/管理 Session

# 始终放在插件列表末尾，避免其他插件覆盖自动保存所需的状态栏配置。
set -g @plugin 'tmux-plugins/tmux-continuum'

# 最后加载 TPM，生效已安装的插件及其快捷键。
run '~/.local/share/tmux/plugins/tpm/tpm'
